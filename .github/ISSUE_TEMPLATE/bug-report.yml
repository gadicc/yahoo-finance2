name: Bug report
description: Report reproducible behavior that appears to be a library bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues and test the latest release before submitting.

        yahoo-finance2 runs on Node.js, Deno, Bun, and Cloudflare Workers. It does not run directly in browsers because Yahoo blocks browser requests through Cross-Origin Resource Sharing (CORS) and cookie restrictions.

  - type: input
    id: module
    attributes:
      label: Module
      description: Which module, command-line interface (CLI) command, or Model Context Protocol (MCP) tool is affected?
      placeholder: quote, chart, CLI, or MCP
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest complete example that reproduces the problem.
      render: typescript
      placeholder: |
        import YahooFinance from "yahoo-finance2";

        const yahooFinance = new YahooFinance();
        await yahooFinance.quote("AAPL");
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What result did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What result did you receive instead?
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js 22 or newer
        - Deno 2 or newer
        - Bun 1 or newer
        - Cloudflare Workers
        - Other supported server runtime
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: Paste the exact version reported by your runtime.
      placeholder: Node.js 22.17.0, Deno 2.4.0, or Bun 1.2.0
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: yahoo-finance2 version
      description: Paste the exact installed version, not a version range from a manifest.
      placeholder: 4.0.0
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error output
      description: Paste the complete error and stack trace, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other details that may help reproduce the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched open and closed issues for an existing report.
          required: true
        - label: I reproduced this problem with the latest yahoo-finance2 release.
          required: true
        - label: I removed credentials, cookies, and other sensitive data from this report.
          required: true
