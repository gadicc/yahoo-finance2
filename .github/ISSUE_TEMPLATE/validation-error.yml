name: Validation error
description: Report Yahoo response data that does not match the library schema
labels: [bug, validation]
body:
  - type: markdown
    attributes:
      value: |
        Validation errors can reveal a Yahoo response change or a symbol-specific edge case. Include the complete validation output so maintainers can update the TypeScript interface and generated schema together.

        See the [validation guide](https://github.com/gadicc/yahoo-finance2/blob/dev/docs/validation.md) for workarounds and contribution instructions.

  - type: input
    id: module
    attributes:
      label: Module
      description: Which module reported the validation error?
      placeholder: quoteSummary
    validations:
      required: true

  - type: input
    id: symbols
    attributes:
      label: Symbol or query
      description: Include every symbol or query needed to reproduce the error.
      placeholder: AAPL
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every request
        - Intermittent
        - Unsure
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact call and options that trigger the error.
      render: typescript
      placeholder: |
        import YahooFinance from "yahoo-finance2";

        const yahooFinance = new YahooFinance();
        await yahooFinance.quoteSummary("AAPL");
    validations:
      required: true

  - type: textarea
    id: validation-output
    attributes:
      label: Complete validation output
      description: Paste the full schema name, validation errors, and stack trace. Do not truncate the reported fields.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js 22 or newer
        - Deno 2 or newer
        - Bun 1 or newer
        - Cloudflare Workers
        - Other supported server runtime
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: Paste the exact version reported by your runtime.
      placeholder: Node.js 22.17.0
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: yahoo-finance2 version
      description: Paste the exact installed version, not a version range from a manifest.
      placeholder: 4.0.0
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Note when the error started or any pattern across symbols and requests.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched open and closed issues for this validation error.
          required: true
        - label: I reproduced this error with the latest yahoo-finance2 release.
          required: true
        - label: I removed credentials, cookies, and other sensitive data from this report.
          required: true
