name: Setup trusted repair tooling
description: Fresh pinned Bun/Node graph and reviewed Linux guard; no candidate hooks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24.21.0
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
        no-cache: true
    - name: Install trusted workflow graph only
      shell: bash
      run: |
        bun run check:toolchain
        bun install --frozen-lockfile
    - name: Require the reviewed Linux boundary
      shell: bash
      run: |
        test "$RUNNER_OS" = Linux
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends bubblewrap python3 libseccomp2 iproute2 util-linux acl
        test "$(readlink -f "$(command -v bwrap)")" = /usr/bin/bwrap
        python3 -I -B -m unittest discover -s scripts -p ci_apparmor_test.py
        python3 -I -B scripts/ci_apparmor.py
        python3 -I -B scripts/ci.py guard
