name: Setup Deno && Node + npm
description: Reusable setup for CI, Copilot, etc.
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        cache: true

    - name: Install dependencies
      run: deno install --frozen
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false
        # No setup-node cache here: this Deno-first repo has no checked-in npm
        # lockfile, and npm installs happen only in scoped workflow steps.

    # Cache npm's download stores, not node_modules, so scoped npm installs
    # still resolve against their own lockfiles while avoiding repeated downloads.
    - uses: actions/cache@v6
      with:
        path: |
          ~/.npm/_cacache
          ~/.npm/_npx
        key: npm-cache-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('deno.json', 'deno.lock', 'release.config.mjs') }}
        restore-keys: |
          npm-cache-${{ runner.os }}-${{ runner.arch }}-node22-
          npm-cache-${{ runner.os }}-${{ runner.arch }}-
