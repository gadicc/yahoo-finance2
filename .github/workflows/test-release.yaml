name: Test & Release
on:
  push:
jobs:
  release:
    name: Test & Release
    runs-on: ubuntu-latest
    permissions:
      # https://github.com/semantic-release/semantic-release/issues/2469
      contents: write # create releases
      issues: write # issue comments and labels
      pull-requests: write # ditto
      id-token: write # The OIDC ID token is used for authentication with JSR.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Run tests, produce coverage
        run: deno task test --coverage

      - name: Process coverage
        run: deno coverage --lcov ./coverage > coverage.lcov

