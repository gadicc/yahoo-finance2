name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup/action.yml
      - .bun-version
      - bun.lock
      - package.json
      - scripts/check-toolchain.mjs
      - scripts/ci.py
      - scripts/testing/offline.py
      - tests/cloudflare/package-lock.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup/action.yml
      - .bun-version
      - bun.lock
      - package.json
      - scripts/check-toolchain.mjs
      - scripts/ci.py
      - scripts/testing/offline.py
      - tests/cloudflare/package-lock.json

concurrency:
  group: copilot-setup-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-24.04

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Copilot cannot call this local composite action. Keep this copy in sync.
      - name: Setup Node tool host
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Setup exact Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Download stores only; never restore node_modules or another package graph.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm/_cacache
          key: bun-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock', 'tests/cloudflare/package-lock.json') }}

      - name: Verify toolchain before resolution
        run: bun run check:toolchain
        shell: bash

      - name: Install frozen root graph with normal lifecycle scripts
        run: bun install --frozen-lockfile
        shell: bash

      - name: Install Linux sandbox prerequisites
        run: |
          test "$RUNNER_OS" = Linux
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap python3 libseccomp2 iproute2 util-linux
          python3 scripts/ci.py guard
        shell: bash
