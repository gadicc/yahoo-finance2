name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Argh, there's a Copilot limitation that doesn't allow for this workflow,
      # without publishing to it's own repo, so, let's not do that.
      #- uses: ./.github/actions/setup

      # And instead, just copy and paste the contents here and remember to keep
      # it up to date *sigh*.
      # -----------------------------------------------------------------------------
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno install --frozen
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
          # No setup-node cache here: this Deno-first repo has no checked-in npm
          # lockfile, and npm installs happen only in scoped workflow steps.

      # Cache npm's download stores, not node_modules, so scoped npm installs
      # still resolve against their own lockfiles while avoiding repeated downloads.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.npm/_cacache
            ~/.npm/_npx
          key: npm-cache-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('deno.json', 'deno.lock', 'release.config.mjs') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-${{ runner.arch }}-node22-
            npm-cache-${{ runner.os }}-${{ runner.arch }}-
      # -----------------------------------------------------------------------------
