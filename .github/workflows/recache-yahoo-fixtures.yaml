name: Re-cache Yahoo fixtures

# Repair-stage security decisions and boundaries: schema-repair-security.md
# Operational setup: ../../docs/schema-repair.md
on:
  # Run once a day at 03:37 UTC. GitHub notes that schedules can be delayed or
  # dropped during high load, especially at the start of the hour, so avoid minute 0.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without committing, pushing, or opening an issue
        required: false
        default: false
        type: boolean
      simulate_drift:
        description: Dry-run testing only; touch one fixture to exercise the change path
        required: false
        default: false
        type: boolean
      repair_only:
        description: Replay a recorded drift commit through the repair pipeline without live recaching
        default: false
        type: boolean
      drift_commit:
        description: Full fixture-drift commit SHA (repair_only)
        default: ""
        type: string
      repair_base:
        description: Optional full dev commit SHA to repair after automation updates; fixtures must match drift_commit (repair_only)
        default: ""
        type: string
      issue_number:
        description: Tracking issue number (repair_only)
        default: 0
        type: number
      auth_only:
        description: Test federation configuration without invoking the model (use repair_only)
        default: false
        type: boolean

concurrency:
  group: yahoo-fixtures-recache-dev
  cancel-in-progress: false

# `contents: write` lets the default GITHUB_TOKEN push fixture drift directly to
# dev. `issues: write` lets it open the follow-up issue.
#
# Pushes made with GITHUB_TOKEN do not trigger ordinary push workflows. If we
# later want the README test badge to turn red immediately after the bot commit,
# there are two reasonable paths:
# - push with a GitHub App token or bot PAT, so the push triggers CI normally;
# - keep GITHUB_TOKEN, add `actions: write`, and dispatch tests.yaml on dev
#   explicitly after pushing.
#
# Direct pushes to dev also require branch protection/settings to allow this
# workflow token to push.
permissions:
  contents: read

jobs:
  branch-policy:
    name: Validate recache branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require dev before recaching or repairing
        run: node scripts/workflow-policy.mjs recache

  recache:
    needs: branch-policy
    if: ${{ !inputs.repair_only }}
    name: Re-cache Yahoo fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      drift_sha: ${{ steps.commit.outputs.sha }}
      issue_number: ${{ steps.issue.outputs.number }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      SIMULATE_DRIFT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.simulate_drift }}
      TARGET_BRANCH: dev

    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - uses: ./.github/actions/setup

      - name: Confirm setup left the tree clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            {
              echo "## Yahoo fixture recache aborted"
              echo
              echo "Setup changed the working tree before tests ran."
              echo
              echo '```text'
              git status --short
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Confirm cached tests already pass
        id: baseline
        shell: bash
        run: |
          set +e
          deno task test:replay 2>&1 | tee "$RUNNER_TEMP/baseline-test.log"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Aborting, since there are existing failing tests."
          {
            echo "## Yahoo fixture recache aborted"
            echo
            echo "Aborting, since there are existing failing tests."
            echo
            echo "The recache job only runs when the cached suite is already green."
            echo
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/baseline-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests against fresh Yahoo responses
        id: recache
        if: steps.baseline.outputs.passed == 'true'
        shell: bash
        env:
          # The runner processes files sequentially and stops on the first 429.
          # The cache's network fetch wrapper serializes all live requests
          # within a file, including requests from separate library instances.
          FETCH_DEVEL: recache
          FETCH_DEVEL_RECACHE_CONCURRENCY: "1"
          FETCH_DEVEL_RECACHE_INTERVAL: "3000"
        run: |
          # In recache mode, failing tests are the signal we are looking for:
          # tests/common.ts rewrites only the cache files for tests that fail
          # against fresh Yahoo responses.
          set +e
          deno task test:recache 2>&1 | tee "$RUNNER_TEMP/recache-test.log"
          status=${PIPESTATUS[0]}
          set -e

          # The runner prints a final aggregate even when a 429 aborts a file.
          sed -n '/^### Yahoo recache request counts$/,$p' "$RUNNER_TEMP/recache-test.log" \
            >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SIMULATE_DRIFT" == "true" ]]; then
            fixture=""
            while IFS= read -r candidate; do
              if [[ ! "$candidate" =~ \.(static|fake)\.json$ ]]; then
                fixture="$candidate"
                break
              fi
            done < <(git ls-files 'tests/fixtures/http/*.json')

            if [[ -z "$fixture" ]]; then
              echo "::error::Could not find a non-static, non-fake fixture for dry-run simulation."
              exit 1
            fi

            printf '\n' >> "$fixture"
            status=1
            echo "::notice::Simulated fixture drift for dry-run testing with $fixture."
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Reject rate-limited recache results
        if: steps.baseline.outputs.passed == 'true'
        shell: bash
        run: |
          # Check both logs and changed/new fixtures: a failed request may not
          # have been written to cache, or its status may be absent from logs.
          mapfile -d '' -t fixtures < <(
            git ls-files -z --modified --others --exclude-standard -- 'tests/fixtures/http/*.json'
          )
          if ! deno run --allow-read="$RUNNER_TEMP/recache-test.log,tests/fixtures/http" \
            scripts/check-recache-rate-limits.ts "$RUNNER_TEMP/recache-test.log" "${fixtures[@]}"; then
            echo "::error::Recache validation failed; no fixtures will be committed or pushed."
            {
              echo "## Yahoo fixture recache aborted"
              echo
              echo "The rate-limit check failed. Inspect the log for HTTP 429 responses or unreadable fixtures."
              echo "No fixtures were staged, committed, or pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Inspect recache results
        id: changes
        if: steps.baseline.outputs.passed == 'true'
        shell: bash
        run: |
          recache_status="${{ steps.recache.outputs.status }}"
          mapfile -t changed_files < <(git status --porcelain=v1 | sed -E 's/^.. //; s/^.* -> //')

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"

            if [[ "$recache_status" -eq 0 ]]; then
              {
                echo "## Yahoo fixture recache"
                echo
                echo "No Yahoo response drift was detected."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            {
              echo "## Yahoo fixture recache failed"
              echo
              echo "The recache test run failed, but it did not produce fixture changes."
              echo "This usually points to an automation, network, or uncached-test problem rather than Yahoo response drift."
              echo
              echo '```text'
              tail -n 160 "$RUNNER_TEMP/recache-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          allowed_files=()
          disallowed_files=()
          for file in "${changed_files[@]}"; do
            if [[ "$file" =~ ^tests/fixtures/http/.*\.json$ && ! "$file" =~ \.(static|fake)\.json$ ]]; then
              allowed_files+=("$file")
            else
              disallowed_files+=("$file")
            fi
          done

          if [[ "${#disallowed_files[@]}" -gt 0 ]]; then
            {
              echo "## Yahoo fixture recache aborted"
              echo
              echo "Recache changed files outside the allowed fixture set."
              echo
              echo "Allowed files are non-static, non-fake JSON fixtures under \`tests/fixtures/http/\`."
              echo
              echo "### Disallowed changes"
              echo
              printf -- "- \`%s\`\n" "${disallowed_files[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$recache_status" -eq 0 ]]; then
            {
              echo "## Yahoo fixture recache aborted"
              echo
              echo "The recache test run passed, but fixture files still changed."
              echo "Since recache mode should only write cache files for failing tests, this needs manual review."
              echo
              printf -- "- \`%s\`\n" "${allowed_files[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          printf '%s\n' "${allowed_files[@]}" > "$RUNNER_TEMP/changed-fixtures.txt"

          mapfile -t modules < <(
            printf '%s\n' "${allowed_files[@]}" |
              awk -F/ '{ print $NF }' |
              sed -E 's/-.*//' |
              sort -u
          )
          module_summary="$(printf '%s\n' "${modules[@]}" | paste -sd, - | sed 's/,/, /g')"

          if [[ "${#modules[@]}" -eq 1 ]]; then
            commit_subject="test(fixtures): record Yahoo API drift for ${modules[0]}"
            issue_title="Yahoo API response drift: ${modules[0]}"
          else
            commit_subject="test(fixtures): record Yahoo API response drift"
            issue_title="Yahoo API response drift detected"
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "changed_count=${#allowed_files[@]}" >> "$GITHUB_OUTPUT"
          echo "commit_subject=$commit_subject" >> "$GITHUB_OUTPUT"
          echo "issue_title=$issue_title" >> "$GITHUB_OUTPUT"
          echo "module_summary=$module_summary" >> "$GITHUB_OUTPUT"

      - name: Stage recached fixtures
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t changed_fixtures < "$RUNNER_TEMP/changed-fixtures.txt"
          git add -- "${changed_fixtures[@]}"
          git diff --cached --stat > "$RUNNER_TEMP/fixture-diff-stat.txt"
          git diff --cached --name-only > "$RUNNER_TEMP/staged-fixtures.txt"

          {
            echo "## Yahoo API response drift detected"
            echo
            echo "- Modules: ${{ steps.changes.outputs.module_summary }}"
            echo "- Changed fixtures: ${{ steps.changes.outputs.changed_count }}"
            echo "- Dry run: \`$DRY_RUN\`"
            echo
            echo "### Diff stat"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/fixture-diff-stat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm dev did not move during the run
        if: steps.changes.outputs.has_changes == 'true' && env.DRY_RUN != 'true'
        shell: bash
        run: |
          git fetch origin "$TARGET_BRANCH"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/$TARGET_BRANCH")"

          if [[ "$local_sha" != "$remote_sha" ]]; then
            {
              echo "## Yahoo fixture recache aborted"
              echo
              echo "\`$TARGET_BRANCH\` moved while this workflow was running."
              echo "Aborting rather than pushing a commit based on a stale baseline test run."
              echo
              echo "- Local: \`$local_sha\`"
              echo "- Remote: \`$remote_sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit and push fixture drift
        id: commit
        if: steps.changes.outputs.has_changes == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          COMMIT_SUBJECT: ${{ steps.changes.outputs.commit_subject }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_message="$(mktemp)"
          {
            echo "$COMMIT_SUBJECT"
            echo
            echo "Automated recache run detected Yahoo API response changes that"
            echo "now fail against the cached test expectations."
            echo
            echo "Changed fixtures:"
            sed 's/^/- /' "$RUNNER_TEMP/staged-fixtures.txt"
            echo
            echo "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Co-authored-by: Codex (GPT-5, reasoning: high)"
          } > "$commit_message"

          git commit -F "$commit_message"
          commit_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"

          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Open tracking issue
        id: issue
        if: steps.changes.outputs.has_changes == 'true' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          ISSUE_TITLE: ${{ steps.changes.outputs.issue_title }}
        run: |
          short_sha="${COMMIT_SHA:0:12}"
          issue_body="$RUNNER_TEMP/issue-body.md"

          {
            echo "A scheduled recache run detected Yahoo API response changes that now fail against the cached test expectations."
            echo
            echo "- Commit: [\`$short_sha\`](https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA)"
            echo "- Workflow run: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Modules: ${{ steps.changes.outputs.module_summary }}"
            echo "- Changed fixtures: ${{ steps.changes.outputs.changed_count }}"
            echo
            echo "## Changed fixtures"
            echo
            sed 's/^/- `/' "$RUNNER_TEMP/staged-fixtures.txt" | sed 's/$/`/'
            echo
            echo "## Diff stat"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/fixture-diff-stat.txt"
            echo '```'
            echo
            echo "## Failing test output"
            echo
            echo '```text'
            tail -n 220 "$RUNNER_TEMP/recache-test.log"
            echo '```'
          } > "$issue_body"

          issue_url="$(gh issue create --title "$ISSUE_TITLE" --body-file "$issue_body")"
          echo "url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "number=${issue_url##*/}" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "Tracking issue: $issue_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report dry run
        if: steps.changes.outputs.has_changes == 'true' && env.DRY_RUN == 'true'
        shell: bash
        run: |
          {
            echo
            echo "Dry run enabled, so no commit was pushed and no issue was opened."
            echo
            echo "Would commit with:"
            echo
            echo '```text'
            echo "${{ steps.changes.outputs.commit_subject }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  repair:
    name: Propose schema repair
    needs: [branch-policy, recache]
    if: >-
      always() && !cancelled() && needs.branch-policy.result == 'success' && github.ref == 'refs/heads/dev' &&
      ((vars.SCHEMA_REPAIR_ENABLED == 'true' && needs.recache.result == 'success' && needs.recache.outputs.drift_sha != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.repair_only))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: schema-repair
    permissions:
      contents: read
      id-token: write
    outputs:
      proposal: ${{ steps.codex.outputs.final-message }}
      base: ${{ steps.prepare.outputs.base }}
      issue: ${{ steps.prepare.outputs.issue }}
    env:
      REPAIR_DRIFT: ${{ inputs.repair_only && inputs.drift_commit || needs.recache.outputs.drift_sha }}
      REPAIR_BASE: ${{ inputs.repair_only && (inputs.repair_base || inputs.drift_commit) || needs.recache.outputs.drift_sha }}
      REPAIR_ISSUE: ${{ inputs.repair_only && inputs.issue_number || needs.recache.outputs.issue_number }}
      SCHEMA_REPAIR_MODEL: ${{ vars.SCHEMA_REPAIR_MODEL || 'gpt-6.1-sol' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate trusted inputs and prepare isolated checkout
        id: prepare
        shell: bash
        run: |
          [[ "$REPAIR_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPAIR_DRIFT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPAIR_ISSUE" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "$REPAIR_BASE" origin/dev
          git merge-base --is-ancestor "$REPAIR_DRIFT" "$REPAIR_BASE"
          # Accept only a recorded fixture-drift commit, never a fork or arbitrary code.
          git diff-tree --no-commit-id --name-only -r "$REPAIR_DRIFT" > "$RUNNER_TEMP/drift-files.txt"
          [[ -s "$RUNNER_TEMP/drift-files.txt" ]]
          while IFS= read -r file; do
            [[ "$file" =~ ^tests/fixtures/http/[A-Za-z0-9_.^=-]+\.json$ ]]
            [[ ! "$file" =~ \.(static|fake)\.json$ ]]
          done < "$RUNNER_TEMP/drift-files.txt"
          # Retry on newer trusted dev code without changing the captured evidence.
          git diff --quiet "$REPAIR_DRIFT" "$REPAIR_BASE" -- tests/fixtures/http || {
            echo '::error::Repair base fixtures differ from the recorded drift; select the matching drift commit.'
            exit 1
          }
          git worktree add --detach candidate "$REPAIR_BASE"
          deno install --frozen
          (cd candidate && deno install --frozen)
          echo "base=$REPAIR_BASE" >> "$GITHUB_OUTPUT"
          echo "issue=$REPAIR_ISSUE" >> "$GITHUB_OUTPUT"

      - name: Start credential-renewing federation proxy
        id: federation
        env:
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        shell: bash
        run: |
          # The root-owned process receives OIDC request credentials via stdin.
          # Codex loses sudo before it starts and receives only a local proxy credential.
          sudo install -d -m 700 "$RUNNER_TEMP/openai-wif"
          sudo install -m 600 scripts/openai-wif-proxy.mjs "$RUNNER_TEMP/openai-wif/proxy.mjs"
          node scripts/start-openai-wif-proxy.mjs "$RUNNER_TEMP/openai-wif/proxy.mjs"

      # Keep Codex last: none of its runner/filesystem mutations are carried onward.
      - name: Repair with Codex
        id: codex
        if: ${{ !inputs.auth_only }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        timeout-minutes: 20
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          codex-version: 0.162.1
          openai-api-key: ${{ steps.federation.outputs.gateway-token }}
          responses-api-endpoint: ${{ steps.federation.outputs.endpoint }}
          working-directory: candidate
          prompt-file: .github/codex/schema-repair.md
          output-schema-file: .github/codex/schema-repair-output.json
          model: ${{ env.SCHEMA_REPAIR_MODEL }}
          effort: high
          safety-strategy: drop-sudo
          sandbox: workspace-write

  verify-repair:
    name: Verify schema repair without credentials
    needs: repair
    # repair_only intentionally skips recache; override the implicit success()
    # check across ancestors, while still requiring a successful proposal job.
    if: ${{ !cancelled() && needs.repair.result == 'success' && needs.repair.outputs.proposal != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.apply.outputs.ready }}
    env:
      REPAIR_BASE: ${{ needs.repair.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
          cache: false
      - name: Prepare verifier
        run: |
          deno install --frozen
          git worktree add --detach candidate "$REPAIR_BASE"
          (cd candidate && deno install --frozen)
      - name: Check and apply schema type proposal
        id: apply
        env:
          PROPOSAL: ${{ needs.repair.outputs.proposal }}
        run: |
          printf '%s' "$PROPOSAL" > "$RUNNER_TEMP/proposal.json"
          cd candidate
          deno run --no-prompt -P=test --deny-net --allow-read --allow-write=src/modules --allow-run=git \
            --config=../deno.json ../scripts/schema-repair.ts apply "$REPAIR_BASE" "$RUNNER_TEMP/proposal.json" \
            > "$RUNNER_TEMP/repair-result.json"
          echo "ready=$(jq -r .ready "$RUNNER_TEMP/repair-result.json")" >> "$GITHUB_OUTPUT"
          jq -r '.summary, "", (.evidence[] | "- " + .)' "$RUNNER_TEMP/repair-result.json" >> "$GITHUB_STEP_SUMMARY"
          [[ "$(jq -r .ready "$RUNNER_TEMP/repair-result.json")" == 'true' ]] || { echo '::error::Schema drift needs manual repair; see the summary.'; exit 1; }
      - name: Independently regenerate and verify
        if: steps.apply.outputs.ready == 'true'
        working-directory: candidate
        run: |
          deno task schema --force
          deno fmt --check src/modules
          deno lint src/modules
          deno task check
          deno task test:replay
          git diff --check
          deno run --no-prompt -P=test --deny-net --allow-read --allow-write="$RUNNER_TEMP/verified-repair.json" --allow-run=git \
            --config=../deno.json ../scripts/schema-repair.ts bundle "$REPAIR_BASE" "$RUNNER_TEMP/proposal.json" "$RUNNER_TEMP/verified-repair.json"
      - name: Upload verified files only
        if: steps.apply.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-schema-repair
          path: ${{ runner.temp }}/verified-repair.json
          retention-days: 7
          if-no-files-found: error

  publish-repair:
    name: Open draft schema repair PR
    needs: [repair, verify-repair]
    if: ${{ !cancelled() && needs.repair.result == 'success' && needs.verify-repair.result == 'success' && needs.verify-repair.outputs.ready == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      REPAIR_BASE: ${{ needs.repair.outputs.base }}
      REPAIR_ISSUE: ${{ needs.repair.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
          cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-schema-repair
          path: ${{ runner.temp }}/verified-repair
      - name: Restore verified data on a clean checkout
        run: |
          deno install --frozen
          git worktree add --detach candidate "$REPAIR_BASE"
          cd candidate
          deno run --no-prompt -P=test --deny-net --allow-read --allow-write=src/modules --allow-run=git \
            --config=../deno.json ../scripts/schema-repair.ts restore "$REPAIR_BASE" "$RUNNER_TEMP/verified-repair/verified-repair.json"
      - name: Publish with trusted code only
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex/schema-drift-$REPAIR_ISSUE"
          # One PR per issue. Do not overwrite an existing branch or someone's work.
          existing="$(gh pr list --state all --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            printf 'Existing repair PR: %s\n' "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ -z "$(git ls-remote --heads origin "refs/heads/$branch")" ]] || { echo 'Repair branch already exists; leaving it untouched.'; exit 1; }
          remote_base="$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/dev --jq .object.sha)"
          [[ "$remote_base" == "$REPAIR_BASE" ]] || { echo 'dev moved; rerun against the current drift before publishing.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- src/modules
          {
            printf 'fix(schema): repair Yahoo response drift (#%s)\n\n' "$REPAIR_ISSUE"
            jq -r .summary "$RUNNER_TEMP/verified-repair/verified-repair.json"
            printf '\nFixes #%s\n\nCo-authored-by: Codex (reasoning: high)\n' "$REPAIR_ISSUE"
          } > "$RUNNER_TEMP/repair-commit.txt"
          git commit -F "$RUNNER_TEMP/repair-commit.txt"
          # The token is never persisted in git config or handed to proposed code.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" push \
            --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          {
            jq -r '.summary, "", (.evidence[] | "- " + .)' "$RUNNER_TEMP/verified-repair/verified-repair.json"
            printf '\nFixes #%s.\n\nValidation: independently regenerated schemas, formatting, lint, type checks, and full cache-only test suite.\n' "$REPAIR_ISSUE"
            printf '\nGenerated from `%s`. Human review is required before merging.\n' "$REPAIR_BASE"
          } > "$RUNNER_TEMP/repair-pr.md"
          url="$(gh pr create --draft --base dev --head "$branch" --title "fix(schema): repair Yahoo response drift (#$REPAIR_ISSUE)" --body-file "$RUNNER_TEMP/repair-pr.md")"
          printf 'Draft repair PR: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
