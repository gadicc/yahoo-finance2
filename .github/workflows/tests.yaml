name: Tests
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

# The caller's workflow name is used for reusable runs. Keep this namespace
# distinct from release-* so a nested Tests call cannot cancel its publisher.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for codecov

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task schema:check
      - run: deno task release:check-notes

      - name: Run tests, produce coverage
        run: deno task test:replay --coverage

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true

  cloudflare-workers:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build npm package
        run: deno task build:npm

      - name: Install Cloudflare test harness dependencies
        run: npm ci --prefix tests/cloudflare

      - name: Run Cloudflare Workers tests
        run: npm test --prefix tests/cloudflare
