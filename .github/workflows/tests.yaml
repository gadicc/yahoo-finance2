name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for codecov

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: deno fmt --check
      - run: deno lint

      - name: Run tests, produce coverage
        run: deno task test --coverage

      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true

  cloudflare-workers:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build npm package
        run: deno task build:npm

      - name: Install Cloudflare test harness dependencies
        run: npm ci --prefix tests/cloudflare

      - name: Run Cloudflare Workers tests
        run: npm test --prefix tests/cloudflare
