name: Release
on:
  push:
    # Match release.config.mjs. Actions globs are not semantic-release extglobs.
    branches:
      - main
      - master
      - next
      - next-major
      - alpha
      - beta
      - "[0-9]+.x"
      - "[0-9]+.[0-9]+.x"
      - "[0-9]+.x.x"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch-policy:
    name: Validate release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require a configured release branch
        id: policy
        run: node scripts/workflow-policy.mjs release

  tests:
    name: Tests
    needs: branch-policy
    if: needs.branch-policy.outputs.allowed == 'true'
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read
      id-token: write # for codecov

  release:
    name: Publish packages
    needs: [branch-policy, tests]
    if: needs.branch-policy.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # https://github.com/semantic-release/semantic-release/issues/2469
      contents: write # create releases
      issues: write # issue comments and labels
      pull-requests: write # ditto
      id-token: write # The OIDC ID token is used for authentication with JSR and npm with provenance
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - run: echo 'The Tests workflow passed'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      # npm verifyConditions reads pkgRoot before semantic-release prepare.
      - name: Build package metadata before publisher verification
        run: bun run build:npm

      - name: Validate publisher inputs without authentication
        run: node scripts/release-policy.mjs

      - name: Release if relevant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # semantic-release and its pinned npm11 child require the Node tool host.
        run: node node_modules/semantic-release/bin/semantic-release.js
